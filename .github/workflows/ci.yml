---
name: CI
on: [push]
env:
  RUST_BACKTRACE: 1
jobs:
  fast-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.4
      - name: Init
        run: ./ci/init.sh
      - name: Lint
        run: ./ci/lint.sh
      - name: Test
        run: ./ci/test.sh
      - name: Benchmarks
        run: ./ci/bench.sh
  slow-tests:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.4
      - name: Test
        run: ./ci/test.sh slow
  publish:
    needs: [fast-tests, slow-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.4
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: ./ci/publish.sh
